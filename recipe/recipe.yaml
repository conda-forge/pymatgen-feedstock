schema_version: 1

context:
  name: pymatgen
  version: "2026.5.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/materialsproject/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 38b88397a9ccd84e40c02e8a5c5109205b93e883bc254950579facd55d50d27c

build:
  number: 1
  skip: match(python, "<=3.10")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pmg = pymatgen.cli.pmg:main
      - feff_plot_cross_section = pymatgen.cli.feff_plot_cross_section:main
      - feff_plot_dos = pymatgen.cli.feff_plot_dos:main
      - get_environment = pymatgen.cli.get_environment:main

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - cython >=0.29.23
    - setuptools >=65.0.0
    - numpy
    - pip
  run:
    - pymatgen-core >=2026.4.16
    - orjson >=3.10,<4
    - lxml >=5.3.1
    - bibtexparser >=1.4.0
    - numpy
    - python
    - matplotlib-base >=3.8
    - monty >=2026.2.18
    - networkx >=2.7
    - palettable >=3.3.3
    - pandas >=2
    - plotly >=5.0.0
    - pybtex >=0.24.0
    - requests >=2.30
    - ruamel.yaml >=0.17.0
    - scipy >=1.14.1
    - spglib >=2.5
    - sympy >=1.3
    - tabulate >=0.9
    - typing_extensions
    - tqdm >=4.60
    - uncertainties >=3.1.4
    - joblib >=1

tests:
  - python:
      imports:
        - pymatgen
        - pymatgen.alchemy
        - pymatgen.analysis
        - pymatgen.analysis.chemenv
        - pymatgen.analysis.chemenv.coordination_environments
        - pymatgen.analysis.chemenv.coordination_environments.coordination_geometries_files
        - pymatgen.analysis.chemenv.utils
        - pymatgen.analysis.cost
        - pymatgen.analysis.diffraction
        - pymatgen.analysis.elasticity
        - pymatgen.analysis.hhi
        - pymatgen.analysis.pourbaix_diagram
        - pymatgen.apps
        - pymatgen.apps.battery
        - pymatgen.apps.borg
        - pymatgen.cli
        - pymatgen.command_line
        - pymatgen.core
        - pymatgen.electronic_structure
        - pymatgen.entries
        - pymatgen.io
        - pymatgen.io.abinit
        - pymatgen.io.feff
        - pymatgen.io.lammps
        - pymatgen.io.vasp
        - pymatgen.ext.matproj
        - pymatgen.optimization
        - pymatgen.analysis.phase_diagram
        - pymatgen.analysis.structure_prediction
        - pymatgen.symmetry
        - pymatgen.transformations
        - pymatgen.util
        - pymatgen.vis
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - pmg --help
      - feff_plot_cross_section --help
      - feff_plot_dos --help
      - get_environment --help

about:
  summary: Python Materials Genomics is a robust materials analysis code that defines core object representations for structures and molecules with support for many electronic structure codes. It is currently the core analysis code powering the Materials Project (https://materialsproject.org).
  license: MIT
  license_file: LICENSE
  homepage: https://pymatgen.org
  documentation: https://pythonhosted.org/pymatgen/

extra:
  recipe-maintainers:
    - jan-janssen
    - shyuep
    - mkhorton
